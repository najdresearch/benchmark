[project]
name = "najd-benchmark"
version = "0.1.0"
description = "Versioned Najd task contracts and deterministic scoring"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
najd-benchmark = "najd_benchmark.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/najd_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
